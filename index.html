<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>베스트맘 제공기록</title>
  <link rel="stylesheet" href="style.css?v=20260819-app14">
</head>
<body>
  <div id="loginView" class="wrap login">
    <div class="card">
      <div class="brand">베스트맘 제공기록</div>
      <p class="muted">운영자는 이메일, 관리사는 사무실에서 받은 아이디로 로그인합니다.</p>
      <div class="mt"><label>아이디 또는 운영자 이메일</label><input id="loginId" autocomplete="username"></div>
      <div class="mt"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password"></div>
      <label class="mt" style="display:flex;align-items:center;gap:9px;font-weight:700;cursor:pointer">
        <input id="autoLogin" type="checkbox" checked style="width:20px;height:20px;min-height:0;margin:0;flex:0 0 auto">
        <span>자동 로그인</span>
      </label>
      <div class="muted tiny">개인 휴대폰에서만 사용해주세요. 비밀번호 자체는 별도로 저장하지 않습니다.</div>
      <button id="loginBtn" class="primary full mt">로그인</button>
      <div id="loginMsg" class="muted mt">연결 확인 중...</div>
      <div class="muted mt tiny">앱 버전 APP-14 · PDF-6</div>
    </div>
  </div>

  <div id="appView" class="wrap hidden">
    <div class="top">
      <div>
        <div class="brand">베스트맘 제공기록</div>
        <div id="who" class="muted"></div>
        <div id="runtimeStatus" class="muted tiny">PDF-6.0 엔진 · 준비 중</div>
      </div>
      <button id="logoutBtn" class="secondary">로그아웃</button>
    </div>
    <div id="adminNav" class="tabs hidden">
      <button class="tab active" data-tab="cases">서비스 관리</button>
      <button class="tab" data-tab="caregivers">관리사 관리</button>
      <button class="tab" data-tab="template">PDF 원본</button>
    </div>
    <div id="main"></div>
  </div>

  <script>
  (() => {
    const VER = '20260819-app14';
    const PDF_ENGINE = 'PDF-6.0';
    const PROJECT_REF = 'chbxwvsetyvzhxdfmzdj';
    let lastError = '';

    const getMsg = () => document.getElementById('loginMsg');
    const setMsg = (text) => { const el = getMsg(); if (el) el.textContent = text; };
    const setRuntime = (text) => { const el = document.getElementById('runtimeStatus'); if (el) el.textContent = text; };

    try {
      if (localStorage.getItem('bestmom_auto_login') === '0') {
        localStorage.removeItem(`sb-${PROJECT_REF}-auth-token`);
      }
    } catch (_) {}

    window.makePdf = () => window.alert('PDF 기능을 준비하고 있습니다. 잠시 후 다시 눌러주세요.');

    window.addEventListener('error', (e) => {
      lastError = e && e.message ? e.message : '알 수 없는 오류';
      if (!document.getElementById('loginView')?.classList.contains('hidden')) {
        setMsg('화면 스크립트 오류: ' + lastError);
      }
    });

    window.addEventListener('unhandledrejection', (e) => {
      lastError = e && e.reason ? String(e.reason.message || e.reason) : '비동기 오류';
      if (!document.getElementById('loginView')?.classList.contains('hidden')) {
        setMsg('화면 처리 오류: ' + lastError);
      }
    });

    function loadScript(src, ok, fail, timeoutMs = 12000) {
      const s = document.createElement('script');
      let done = false;
      const finish = (success) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        success ? (ok && ok()) : (fail && fail());
      };
      const timer = setTimeout(() => finish(false), timeoutMs);
      s.src = src;
      s.async = true;
      s.onload = () => finish(true);
      s.onerror = () => finish(false);
      document.head.appendChild(s);
    }

    function loadPdfModule() {
      setRuntime(`${PDF_ENGINE} 엔진 · 새 파일 불러오는 중`);
      loadScript('pdf-v6.js', () => {
        if (window.BESTMOM_PDF_ENGINE !== PDF_ENGINE) {
          setRuntime(`PDF 엔진 버전 불일치 · ${window.BESTMOM_PDF_ENGINE || '확인불가'}`);
          window.makePdf = () => window.alert('PDF 엔진 버전이 맞지 않습니다. 화면을 다시 열어주세요.');
          return;
        }
        loadScript('pdf-save-v6.js', () => {
          if (typeof window.makePdf === 'function' && typeof window.savePdf === 'function') {
            setRuntime(`${PDF_ENGINE} 엔진 · 준비 완료`);
          } else {
            setRuntime(`${PDF_ENGINE} 엔진 · 시작 실패`);
          }
        }, () => {
          setRuntime(`${PDF_ENGINE} 엔진 · 저장 모듈 실패`);
        });
      }, () => {
        setRuntime(`${PDF_ENGINE} 엔진 · 파일 로딩 실패`);
        window.makePdf = () => window.alert('PDF 새 엔진을 불러오지 못했습니다. 화면을 새로고침해주세요.');
      });
    }

    function loadPdfTools() {
      setRuntime(`${PDF_ENGINE} 엔진 · 라이브러리 연결 중`);
      loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', loadPdfModule, () => {
        setRuntime(`${PDF_ENGINE} 엔진 · 라이브러리 재시도 중`);
        loadScript('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js', loadPdfModule, () => {
          setRuntime(`${PDF_ENGINE} 엔진 · 라이브러리 연결 실패`);
          window.makePdf = () => window.alert('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
        });
      });
    }

    function finishAppStart() {
      setTimeout(() => {
        const btn = document.getElementById('loginBtn');
        if (btn && typeof btn.onclick === 'function') {
          setMsg('준비 완료 · 로그인해주세요.');
          loadPdfTools();
        } else {
          setMsg('앱 시작 오류' + (lastError ? ': ' + lastError : ' · 로그인 기능을 연결하지 못했습니다.'));
        }
      }, 0);
    }

    function loadInputWarning() {
      loadScript('input-warning-v14.js?v=' + VER, finishAppStart, finishAppStart);
    }

    function loadCaregiverSort() {
      loadScript('caregiver-sort-v12.js?v=' + VER, loadInputWarning, loadInputWarning);
    }

    function loadAdminDelete() {
      loadScript('admin-delete-v11.js?v=' + VER, loadCaregiverSort, loadCaregiverSort);
    }

    function loadAdminSearch() {
      loadScript('admin-search-v10.js?v=' + VER, loadAdminDelete, loadAdminDelete);
    }

    function loadNotesGuide() {
      loadScript('ui-note-v9.js?v=' + VER, loadAdminSearch, loadAdminSearch);
    }

    function loadSaveFlow() {
      loadScript('save-flow-v8.js?v=' + VER, loadNotesGuide, loadNotesGuide);
    }

    function loadUnlockPatch() {
      loadScript('unlock-fix.js?v=' + VER, loadSaveFlow, loadSaveFlow);
    }

    function loadAppPatches() {
      loadScript('auto-login.js?v=' + VER, loadUnlockPatch, loadUnlockPatch);
    }

    function startApp() {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        setMsg('Supabase 연결 모듈을 불러오지 못했습니다.');
        return;
      }
      setMsg('연결 모듈 준비됨 · 앱 시작 중...');
      loadScript('app.js?v=' + VER, loadAppPatches, () => setMsg('앱 파일을 불러오지 못했습니다.'));
    }

    function tryUnpkg() {
      setMsg('연결 모듈 다시 불러오는 중...');
      loadScript('https://unpkg.com/@supabase/supabase-js@2.110.3/dist/umd/supabase.js', startApp, () => {
        setMsg('Supabase 연결 모듈 로딩 실패');
      });
    }

    function bootLoader() {
      setMsg('연결 확인 중...');
      loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3/dist/umd/supabase.js', startApp, tryUnpkg);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootLoader);
    else bootLoader();
  })();
  </script>
</body>
</html>
