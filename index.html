<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>베스트맘 제공기록</title>
  <link rel="stylesheet" href="style.css?v=20260818-2314">
</head>
<body>
  <div id="loginView" class="wrap login">
    <div class="card">
      <div class="brand">베스트맘 제공기록</div>
      <p class="muted">운영자는 이메일, 관리사는 사무실에서 받은 아이디로 로그인합니다.</p>
      <div class="mt"><label>아이디 또는 운영자 이메일</label><input id="loginId" autocomplete="username"></div>
      <div class="mt"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password"></div>
      <button id="loginBtn" class="primary full mt">로그인</button>
      <div id="loginMsg" class="muted mt">연결 확인 중...</div>
      <div class="muted mt tiny">화면 버전 2026-08-18 23:14</div>
    </div>
  </div>

  <div id="appView" class="wrap hidden">
    <div class="top">
      <div><div class="brand">베스트맘 제공기록</div><div id="who" class="muted"></div></div>
      <button id="logoutBtn" class="secondary">로그아웃</button>
    </div>
    <div id="adminNav" class="tabs hidden">
      <button class="tab active" data-tab="cases">서비스 관리</button>
      <button class="tab" data-tab="caregivers">관리사 관리</button>
      <button class="tab" data-tab="template">PDF 원본</button>
    </div>
    <div id="main"></div>
  </div>

  <script>
  (() => {
    const VER = '20260818-2314';
    let lastError = '';
    const getMsg = () => document.getElementById('loginMsg');
    const setMsg = (text) => { const el = getMsg(); if (el) el.textContent = text; };

    window.addEventListener('error', (e) => {
      lastError = e && e.message ? e.message : '알 수 없는 오류';
      setMsg('화면 스크립트 오류: ' + lastError);
    });
    window.addEventListener('unhandledrejection', (e) => {
      lastError = e && e.reason ? String(e.reason.message || e.reason) : '비동기 오류';
      setMsg('화면 처리 오류: ' + lastError);
    });

    function loadScript(src, ok, fail) {
      const s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = () => ok && ok();
      s.onerror = () => fail && fail();
      document.head.appendChild(s);
    }

    function loadPdfTools() {
      loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', () => {
        loadScript('pdf.js?v=' + VER, () => {}, () => {});
      }, () => {
        loadScript('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js', () => {
          loadScript('pdf.js?v=' + VER, () => {}, () => {});
        }, () => {});
      });
    }

    function finishAppStart() {
      setTimeout(() => {
        const btn = document.getElementById('loginBtn');
        if (btn && typeof btn.onclick === 'function') {
          setMsg('준비 완료 · 로그인해주세요.');
          loadPdfTools();
        } else {
          setMsg('앱 시작 오류' + (lastError ? ': ' + lastError : ' · 로그인 기능을 연결하지 못했습니다.'));
        }
      }, 0);
    }

    function startApp() {
      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        setMsg('Supabase 연결 모듈을 불러오지 못했습니다.');
        return;
      }
      setMsg('연결 모듈 준비됨 · 앱 시작 중...');
      loadScript('app.js?v=' + VER, () => {
        loadScript('unlock-fix.js?v=' + VER, finishAppStart, finishAppStart);
      }, () => setMsg('앱 파일을 불러오지 못했습니다.'));
    }

    function tryUnpkg() {
      setMsg('연결 모듈 다시 불러오는 중...');
      loadScript('https://unpkg.com/@supabase/supabase-js@2.110.3/dist/umd/supabase.js', startApp, () => {
        setMsg('Supabase 연결 모듈 로딩 실패');
      });
    }

    function bootLoader() {
      setMsg('연결 확인 중...');
      loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.3/dist/umd/supabase.js', startApp, tryUnpkg);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootLoader);
    else bootLoader();
  })();
  </script>
</body>
</html>
